*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:#F1F5F9;overflow:hidden;}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px;}
::-webkit-scrollbar-track{background:transparent;}
select,input,textarea,button{font-family:inherit;}
#loading-screen{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:#F1F5F9;z-index:9999;flex-direction:column;gap:16px;}
#loading-screen .spinner{width:40px;height:40px;border:4px solid #E2E8F0;border-top:4px solid #4F46E5;border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-screen .text{color:#64748B;font-size:14px;}
#error-screen{display:none;position:fixed;top:0;left:0;right:0;bottom:0;padding:40px;background:#FEF2F2;z-index:9999;overflow:auto;}
#error-screen h2{color:#EF4444;margin-bottom:12px;}
#error-screen pre{background:#fff;padding:16px;border-radius:8px;border:1px solid #FECACA;overflow:auto;font-size:13px;color:#333;white-space:pre-wrap;}

<div id="loading-screen"><div class="spinner"></div><div class="text">Loading Beaver Data Engine...</div></div>

<script>
window.addEventListener('error', function(e) {
  var ls = document.getElementById('loading-screen');
  if(ls) ls.style.display = 'none';
  var el = document.getElementById('error-screen');
  el.style.display = 'block';
  document.getElementById('error-msg').textContent = e.message + '\n' + (e.filename||'') + ':' + (e.lineno||'') + (e.error ? '\n' + e.error.stack : '');
});
</script>

/* ============================================================
   CSS CHART COMPONENTS (pure CSS, no external dependency)
   ============================================================ */
const HorizontalBarChart = ({data, color="#4F46E5"}) => {
  const maxVal = Math.max(...data.map(d=>d.value), 1);
  return <div style={{display:"flex",flexDirection:"column",gap:8,padding:"8px 0"}}>
    {data.map((d,i)=>(
      <div key={i} style={{display:"flex",alignItems:"center",gap:8}}>
        <div style={{width:120,fontSize:11,color:"#64748B",textAlign:"right",flexShrink:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={d.name}>{d.name}</div>
        <div style={{flex:1,backgroundColor:"#F1F5F9",borderRadius:4,height:22}}>
          <div style={{width:`${(d.value/maxVal)*100}%`,backgroundColor:d.color||color,height:22,borderRadius:4,transition:"width 0.5s ease",minWidth:2}}/>
        </div>
        <div style={{width:30,fontSize:13,fontWeight:600,color:"#334155",textAlign:"right"}}>{d.value}</div>
      </div>
    ))}
  </div>;
};
const VerticalBarChart = ({data, color="#10B981"}) => {
  const maxVal = Math.max(...data.map(d=>d.count||d.value), 1);
  return <div>
    <div style={{display:"flex",alignItems:"flex-end",gap:12,height:180,padding:"8px 0",borderBottom:"2px solid #E2E8F0"}}>
      {data.map((d,i)=>{
        const v = d.count||d.value;
        return <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
          <div style={{fontSize:13,fontWeight:600,color:"#334155"}}>{v}</div>
          <div style={{width:"100%",maxWidth:50,height:`${(v/maxVal)*140}px`,backgroundColor:d.color||color,borderRadius:"4px 4px 0 0",transition:"height 0.5s ease",minHeight:2}}/>
        </div>;
      })}
    </div>
    <div style={{display:"flex",gap:12,paddingTop:6}}>
      {data.map((d,i)=><div key={i} style={{flex:1,textAlign:"center",fontSize:11,color:"#64748B"}}>{d.name}</div>)}
    </div>
  </div>;
};
const SimplePieChart = ({data}) => {
  const total = data.reduce((s,d)=>s+d.value,0);
  if(total===0) return <div style={{textAlign:"center",color:"#94A3B8",padding:40}}>No data</div>;
  let cumulative = 0;
  const segments = data.map(d=>{
    const start = cumulative/total*360;
    cumulative += d.value;
    const end = cumulative/total*360;
    return {start, end, color: d.color, name: d.name, value: d.value, pct: Math.round(d.value/total*100)};
  });
  const gradient = segments.map(s=>`${s.color} ${s.start}deg ${s.end}deg`).join(", ");
  return <div style={{display:"flex",alignItems:"center",gap:24}}>
    <div style={{width:160,height:160,borderRadius:"50%",background:`conic-gradient(${gradient})`,flexShrink:0,position:"relative"}}>
      <div style={{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",width:80,height:80,borderRadius:"50%",backgroundColor:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,fontWeight:700,color:"#334155"}}>{total}</div>
    </div>
    <div style={{display:"flex",flexDirection:"column",gap:6}}>
      {segments.map((s,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:8,fontSize:12}}>
        <div style={{width:12,height:12,borderRadius:3,backgroundColor:s.color,flexShrink:0}}/>
        <span style={{color:"#334155"}}>{s.name}</span>
        <span style={{color:"#94A3B8",fontWeight:600}}>{s.value} ({s.pct}%)</span>
      </div>)}
    </div>
  </div>;
};

const getLabel=(opts,val)=>{const f=opts.find(o=>o.value===val);return f?f.label:val;};
const fmtDur=s=>{if(!s)return"—";const m=Math.floor(s/60);return m>0?`${m}m ${s%60}s`:`${s}s`;};
const fmtDist=m=>{if(!m)return"—";return m>=1000?`${(m/1000).toFixed(1)} km`:`${m} m`;};
const fmtDate=d=>{if(!d)return"—";return new Date(d).toLocaleDateString("zh-CN",{year:"numeric",month:"2-digit",day:"2-digit"});};
const exportJSON=(data,fn)=>{const b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=fn;a.click();URL.revokeObjectURL(u);};

const Btn=({children,onClick,variant="primary",style:s={},disabled=false})=>{const base={display:"inline-flex",alignItems:"center",gap:6,padding:"8px 16px",borderRadius:8,fontSize:14,fontWeight:500,cursor:disabled?"not-allowed":"pointer",border:"none",opacity:disabled?0.5:1};const vs={primary:{backgroundColor:COLORS.primary,color:"#fff"},secondary:{backgroundColor:"#F1F5F9",color:COLORS.text,border:`1px solid ${COLORS.border}`},ghost:{backgroundColor:"transparent",color:COLORS.textSecondary}};return <button onClick={onClick} disabled={disabled} style={{...base,...vs[variant],...s}}>{children}</button>;};
const Sel=({value,onChange,options,placeholder="Select...",style:s={}})=><select value={value} onChange={e=>onChange(e.target.value)} style={{padding:"8px 12px",borderRadius:8,border:`1px solid ${COLORS.border}`,fontSize:13,color:COLORS.text,backgroundColor:"#fff",outline:"none",minWidth:140,...s}}><option value="">{placeholder}</option>{options.map(o=><option key={o.value} value={o.value}>{o.label||o.value}</option>)}</select>;
const Inp=({value,onChange,placeholder="",type="text",style:s={}})=><input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={{padding:"8px 12px",borderRadius:8,border:`1px solid ${COLORS.border}`,fontSize:13,color:COLORS.text,outline:"none",width:"100%",boxSizing:"border-box",...s}}/>;

      <StatCard icon="activity" label="Takeover Cases 接管案例" value={takeCnt} color="#EC4899"/>

  const [page,setPage]=useState("dashboard");
  const [viewAssetId,setViewAssetId]=useState(null);
  const [assets,setAssets]=useState(MOCK_ASSETS);
  useEffect(()=>{var ls=document.getElementById('loading-screen');if(ls)ls.style.display='none';},[]);
  const handleView=(id)=>{setViewAssetId(id);setPage("passport");};
  const handleBack=()=>{setViewAssetId(null);setPage("list");};
  const handleCreate=(formData)=>{
    const newAsset={...formData,asset_id:`BDP-2026-${String(assets.length+1).padStart(6,"0")}`,created_at:new Date().toISOString(),updated_at:new Date().toISOString(),mission_id:`MSN-${Date.now()}`,start_time:formData.start_time||null,end_time:formData.end_time||null,duration_seconds:formData.duration_seconds?parseInt(formData.duration_seconds):0,distance_meters:formData.distance_meters?parseInt(formData.distance_meters):0,average_speed_mps:formData.average_speed_mps?parseFloat(formData.average_speed_mps):0,max_speed_mps:formData.max_speed_mps?parseFloat(formData.max_speed_mps):0,payload_kg:formData.payload_kg?parseFloat(formData.payload_kg):0,battery_start_percent:formData.battery_start_percent?parseInt(formData.battery_start_percent):0,battery_end_percent:formData.battery_end_percent?parseInt(formData.battery_end_percent):0,data_size_gb:formData.data_size_gb?parseFloat(formData.data_size_gb):0,video_duration_seconds:formData.video_duration_seconds?parseInt(formData.video_duration_seconds):0,frame_rate:formData.frame_rate?parseInt(formData.frame_rate):30,takeover_count:formData.takeover_count?parseInt(formData.takeover_count):0,takeover_duration_seconds:formData.takeover_duration_seconds?parseInt(formData.takeover_duration_seconds):0,gps_start_lat:0,gps_start_lng:0,gps_end_lat:0,gps_end_lng:0,sensor_config:{rgb_camera:formData.sensor_rgb,depth_camera:formData.sensor_depth,lidar:formData.sensor_lidar,imu:formData.sensor_imu,gps:formData.sensor_gps,wheel_odometry:formData.sensor_odom,microphone:formData.sensor_mic},sample_preview_url:"",camera_model:formData.camera_model||"",camera_mount_position:formData.camera_mount_position||"head_front",camera_height_m:formData.camera_height_m?parseFloat(formData.camera_height_m):0,camera_tilt_deg:formData.camera_tilt_deg?parseFloat(formData.camera_tilt_deg):0,collector_id:formData.collector_id||"",collector_role:formData.collector_role||"courier",collector_experience_months:formData.collector_experience_months?parseInt(formData.collector_experience_months):0,action_segments:formData.action_segments||[],redacted_intervals_count:formData.redacted_intervals_count||0,redacted_intervals_duration_s:formData.redacted_intervals_duration_s||0,data_format_version:formData.data_format_version||"1.0",duplicate_hash:formData.duplicate_hash||"",calibration_status:formData.calibration_status||"not_calibrated",imu_sampling_rate_hz:formData.imu_sampling_rate_hz?parseInt(formData.imu_sampling_rate_hz):0,gps_sampling_rate_hz:formData.gps_sampling_rate_hz?parseInt(formData.gps_sampling_rate_hz):0,recording_device:formData.recording_device||"head_mounted",data_quality_issues:formData.data_quality_issues||[],tokenization_status:formData.tokenization_status||"not_ready",asset_hash:formData.asset_hash||"",metadata_hash:formData.metadata_hash||"",license_agreement_hash:formData.license_agreement_hash||"",privacy_proof_hash:formData.privacy_proof_hash||"",chain_record_url:formData.chain_record_url||"",credential_id:formData.credential_id||"",token_id:formData.token_id||"",token_standard:formData.token_standard||"",token_rights_type:formData.token_rights_type||"not_defined",transferability:formData.transferability||"non_transferable",tokenization_risk_level:formData.tokenization_risk_level||"not_assessed"};
    setAssets(prev=>[newAsset,...prev]);

  const renderPage=()=>{
    if(page==="passport"&&currentAsset)return <AssetPassportPage asset={currentAsset} onBack={handleBack}/>;
    switch(page){case "dashboard":return <DashboardPage assets={assets}/>;case "list":return <AssetListPage assets={assets} onViewAsset={handleView}/>;case "create":return <CreateAssetPage onSubmit={handleCreate}/>;case "packages":return <ProductPackagesPage assets={assets} onViewAsset={handleView}/>;default:return <DashboardPage assets={assets}/>;}
  };
  return <div style={{display:"flex",minHeight:"100vh",backgroundColor:COLORS.bg,fontFamily:"-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"}}>
    <Sidebar activePage={page==="passport"?"list":page} onNavigate={p=>{setPage(p);if(p!=="passport")setViewAssetId(null);}}/>
    <div style={{flex:1,padding:28,overflowY:"auto",maxHeight:"100vh"}}>{renderPage()}</div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<BeaverDataEngine/>);
</script>
</body>
</html>
