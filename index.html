#error-screen{display:none;position:fixed;top:0;left:0;right:0;bottom:0;padding:40px;background:#FEF2F2;z-index:9999;overflow:auto;}
#error-screen h2{color:#EF4444;margin-bottom:12px;}

<div id="loading-screen"><div class="spinner"></div><div class="text">Loading 小狸 Last-100m Passage Data Engine...</div></div>

<script>
window.addEventListener('error', function(e) {
  var ls = document.getElementById('loading-screen');
  if(ls) ls.style.display = 'none';
  var el = document.getElementById('error-screen');
  el.style.display = 'block';
  document.getElementById('error-msg').textContent = e.message + '\n' + (e.filename||'') + ':' + (e.lineno||'') + (e.error ? '\n' + e.error.stack : '');
});
</script>

<script>
// Final CDN check - show error if nothing loaded
setTimeout(function(){
  if(!window.React||!window.ReactDOM||!window.Babel){
    document.getElementById('loading-screen').style.display='none';
    document.getElementById('error-screen').style.display='block';
    document.getElementById('error-msg').textContent='CDN resources failed to load.\nReact: '+(!!window.React)+' ReactDOM: '+(!!window.ReactDOM)+' Babel: '+(!!window.Babel)+'\nPlease check your network connection and refresh.';
  }
},5000);
</script>

const HorizontalBarChart = ({data, color="#4F46E5"}) => {
  const maxVal = Math.max(...data.map(d=>d.value), 1);
  return <div style={{display:"flex",flexDirection:"column",gap:8,padding:"8px 0"}}>
    {data.map((d,i)=>(
      <div key={i} style={{display:"flex",alignItems:"center",gap:8}}>
        <div style={{width:120,fontSize:11,color:"#64748B",textAlign:"right",flexShrink:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={d.name}>{d.name}</div>
        <div style={{flex:1,backgroundColor:"#F1F5F9",borderRadius:4,height:22}}>
          <div style={{width:`${(d.value/maxVal)*100}%`,backgroundColor:d.color||color,height:22,borderRadius:4,transition:"width 0.5s ease",minWidth:2}}/>
        </div>
        <div style={{width:30,fontSize:13,fontWeight:600,color:"#334155",textAlign:"right"}}>{d.value}</div>
      </div>
    ))}
  </div>;
};
const VerticalBarChart = ({data, color="#10B981"}) => {
  const maxVal = Math.max(...data.map(d=>d.count||d.value), 1);
  return <div>
    <div style={{display:"flex",alignItems:"flex-end",gap:12,height:180,padding:"8px 0",borderBottom:"2px solid #E2E8F0"}}>
      {data.map((d,i)=>{
        const v = d.count||d.value;
        return <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
          <div style={{fontSize:13,fontWeight:600,color:"#334155"}}>{v}</div>
          <div style={{width:"100%",maxWidth:50,height:`${(v/maxVal)*140}px`,backgroundColor:d.color||color,borderRadius:"4px 4px 0 0",transition:"height 0.5s ease",minHeight:2}}/>
        </div>;
      })}
    </div>
    <div style={{display:"flex",gap:12,paddingTop:6}}>
      {data.map((d,i)=><div key={i} style={{flex:1,textAlign:"center",fontSize:11,color:"#64748B"}}>{d.name}</div>)}
    </div>
  </div>;
};
const SimplePieChart = ({data}) => {
  const total = data.reduce((s,d)=>s+d.value,0);
  if(total===0) return <div style={{textAlign:"center",color:"#94A3B8",padding:40}}>暂无数据</div>;
  let cumulative = 0;
  const segments = data.map(d=>{
    const start = cumulative/total*360;
    cumulative += d.value;
    const end = cumulative/total*360;
    return {start, end, color: d.color, name: d.name, value: d.value, pct: Math.round(d.value/total*100)};
  });
  const gradient = segments.map(s=>`${s.color} ${s.start}deg ${s.end}deg`).join(", ");
  return <div style={{display:"flex",alignItems:"center",gap:24}}>
    <div style={{width:160,height:160,borderRadius:"50%",background:`conic-gradient(${gradient})`,flexShrink:0,position:"relative"}}>
      <div style={{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",width:80,height:80,borderRadius:"50%",backgroundColor:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,fontWeight:700,color:"#334155"}}>{total}</div>
    </div>
    <div style={{display:"flex",flexDirection:"column",gap:6}}>
      {segments.map((s,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:8,fontSize:12}}>
        <div style={{width:12,height:12,borderRadius:3,backgroundColor:s.color,flexShrink:0}}/>
        <span style={{color:"#334155"}}>{s.name}</span>
        <span style={{color:"#94A3B8",fontWeight:600}}>{s.value} ({s.pct}%)</span>
      </div>)}
    </div>
  </div>;
};

const STORAGE_KEY = 'beaver-v0.2-data';
function loadData(key, defaultData) {
  try {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) {
      const parsed = JSON.parse(stored);
      return parsed[key] !== undefined ? parsed[key] : defaultData;
    }
  } catch(e) { console.warn('localStorage read error:', e); }
  return defaultData;
}
function saveAllData(dataObj) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(dataObj));
  } catch(e) { console.warn('localStorage write error:', e); }
}

const PrivacyPage=({assets,setAssets})=>{
  const [filter,setFilter]=useState("all");

    if(filter==="high")return highRisk;
    if(filter==="external")return assets.filter(a=>a.commercial_license_allowed&&a.privacy_processed);
    if(filter==="internal")return assets.filter(a=>!a.commercial_license_allowed);
    if(filter==="pending")return assets.filter(a=>!a.privacy_processed);
    return assets;
  },[assets,filter,highRisk]);

const FileUploadPage=({assets,files,setFiles})=>{
  const [dragActive,setDragActive]=useState(false);

  const totalGB=files.reduce((s,f)=>s+(f.file_size_gb||0),0).toFixed(1);
  const uploaded=files.filter(f=>f.upload_status==="uploaded").length;
  const local=files.filter(f=>f.upload_status==="local").length;
  const linked=files.filter(f=>f.asset_id).length;
  const STATUS_C={uploaded:COLORS.success,uploading:COLORS.info,local:COLORS.warning,failed:COLORS.error};
  const STATUS_L={uploaded:"OSS",uploading:"Uploading...",local:"Local SD",failed:"Failed"};
  const handleDrop=(e)=>{e.preventDefault();setDragActive(false);if(e.dataTransfer?.files?.length>0){const nf=Array.from(e.dataTransfer.files).map((f,i)=>({id:"FILE-NEW-"+Date.now()+"-"+i,file_name:f.name,file_size_gb:parseFloat((f.size/1073741824).toFixed(2)),content_type:f.type||"video/mp4",asset_id:"",collector_id:"",recorded_at:new Date().toISOString(),upload_status:"local",storage_location:"Local Browser",sha256:""}));setFiles(prev=>[...nf,...prev]);}};
  const simulateUpload=(fid)=>{setFiles(prev=>prev.map(f=>f.id===fid?{...f,upload_status:"uploading",upload_progress:0}:f));let p=0;const iv=setInterval(()=>{p+=Math.random()*15+5;if(p>=100){clearInterval(iv);setFiles(prev=>prev.map(f=>f.id===fid?{...f,upload_status:"uploaded",upload_progress:100,storage_location:"oss://beaver-data/"+new Date().toISOString().slice(0,10).replace(/-/g,"/"),sha256:"sim_"+Math.random().toString(36).slice(2,14)}:f));}else{setFiles(prev=>prev.map(f=>f.id===fid?{...f,upload_progress:Math.min(Math.round(p),99)}:f));}},300);};
  const linkFile=(fid,aid)=>{setFiles(prev=>prev.map(f=>f.id===fid?{...f,asset_id:aid}:f));};
  const removeFile=(fid)=>{setFiles(prev=>prev.filter(f=>f.id!==fid));};
  return <div>
    <h1 style={{fontSize:24,fontWeight:700,color:COLORS.text,margin:0}}>File Management 文件管理</h1>

    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,margin:"20px 0"}}>
      <StatCard icon="harddrive" label="Total Files 总文件" value={files.length} color={COLORS.primary} sub={totalGB+" GB"}/>
      <StatCard icon="checkcircle" label="On OSS 已上云" value={uploaded} color={COLORS.success}/>
      <StatCard icon="folder" label="Local 待上传" value={local} color={COLORS.warning}/>
      <StatCard icon="link" label="Linked 已关联" value={linked} color={COLORS.info} sub={"of "+files.length}/>
    </div>
    <div style={{display:"flex",gap:0,marginBottom:16}}>
      {["upload","files"].map(t=><button key={t} onClick={()=>setTab(t)} style={{padding:"10px 24px",borderRadius:"8px 8px 0 0",border:`1px solid ${COLORS.border}`,borderBottom:"none",backgroundColor:tab===t?"#fff":"#F8FAFC",color:tab===t?COLORS.primary:COLORS.textSecondary,fontSize:14,fontWeight:tab===t?600:400,cursor:"pointer"}}>{t==="upload"?"Upload 上传":"Files 文件列表"}</button>)}
    </div>
    {tab==="upload"&&<Card style={{borderRadius:"0 12px 12px 12px"}}>
      <div onDragEnter={()=>setDragActive(true)} onDragOver={e=>e.preventDefault()} onDragLeave={()=>setDragActive(false)} onDrop={handleDrop} style={{border:`2px dashed ${dragActive?COLORS.primary:COLORS.border}`,borderRadius:12,padding:48,textAlign:"center",backgroundColor:dragActive?"#EEF2FF":"#FAFBFC",transition:"all 0.2s",cursor:"pointer",marginBottom:24}}>
        <Icon name="upload" size={48} color={dragActive?COLORS.primary:COLORS.textMuted} strokeWidth={1.5}/>
        <div style={{fontSize:18,fontWeight:600,color:COLORS.text,marginTop:16}}>拖拽视频文件到这里</div>
        <div style={{fontSize:14,color:COLORS.textSecondary,marginTop:8}}>或点击选择文件 · 支持 MP4 / MOV / AVI</div>
      </div>
      <div style={{borderTop:`1px solid ${COLORS.border}`,paddingTop:20}}>
        <div style={{fontSize:15,fontWeight:600,marginBottom:12}}>Batch Upload 批量上传指南</div>
        <div style={{backgroundColor:"#F8FAFC",borderRadius:8,padding:16,fontSize:13,color:COLORS.textSecondary,lineHeight:1.8}}>
          <div>1. 快递员回到站点，将 SD 卡视频拷贝到 <code style={{backgroundColor:"#E2E8F0",padding:"1px 6px",borderRadius:4}}>D:\raw_data\YYYY-MM-DD\CR-XXX\</code></div>
          <div>2. 站点电脑运行上传客户端（V0.3），自动扫描新文件并上传到 OSS</div>
          <div>3. 上传完成后，在平台上将视频文件关联到对应的数据资产</div>
        </div>
      </div>
    </Card>}
    {tab==="files"&&<Card style={{padding:0,borderRadius:"0 12px 12px 12px",overflow:"auto"}}>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
        <thead><tr><th style={{padding:"10px 12px",textAlign:"left",fontSize:12,fontWeight:600,color:COLORS.textSecondary,borderBottom:`2px solid ${COLORS.border}`,backgroundColor:"#F8FAFC"}}>File Name</th><th style={{padding:"10px 12px",textAlign:"right",fontSize:12,fontWeight:600,color:COLORS.textSecondary,borderBottom:`2px solid ${COLORS.border}`,backgroundColor:"#F8FAFC"}}>Size</th><th style={{padding:"10px 12px",textAlign:"center",fontSize:12,fontWeight:600,color:COLORS.textSecondary,borderBottom:`2px solid ${COLORS.border}`,backgroundColor:"#F8FAFC"}}>Collector</th><th style={{padding:"10px 12px",textAlign:"center",fontSize:12,fontWeight:600,color:COLORS.textSecondary,borderBottom:`2px solid ${COLORS.border}`,backgroundColor:"#F8FAFC"}}>Status</th><th style={{padding:"10px 12px",textAlign:"center",fontSize:12,fontWeight:600,color:COLORS.textSecondary,borderBottom:`2px solid ${COLORS.border}`,backgroundColor:"#F8FAFC"}}>Linked Asset</th><th style={{padding:"10px 12px",textAlign:"center",fontSize:12,fontWeight:600,color:COLORS.textSecondary,borderBottom:`2px solid ${COLORS.border}`,backgroundColor:"#F8FAFC"}}>Action</th></tr></thead>
        <tbody>{files.map(f=><tr key={f.id} style={{borderBottom:`1px solid ${COLORS.border}`}}>
          <td style={{padding:"10px 12px"}}><div style={{display:"flex",alignItems:"center",gap:8}}><Icon name="video" size={16} color={COLORS.textMuted}/><div><div style={{fontSize:12,fontWeight:500,maxWidth:280,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{f.file_name}</div><div style={{fontSize:11,color:COLORS.textMuted}}>{f.recorded_at?new Date(f.recorded_at).toLocaleDateString("zh-CN"):""}</div></div></div></td>

          <td style={{padding:"10px 12px",textAlign:"center"}}><Sel value={f.asset_id||""} onChange={v=>linkFile(f.id,v)} options={[{value:"",label:"— Link Asset —"},...assets.map(a=>({value:a.asset_id,label:a.asset_id+" "+a.asset_name.slice(0,10)}))]} style={{fontSize:11,minWidth:160,padding:"4px 8px"}}/></td>

        </tr>)}</tbody>

   ============================================================ */
function BeaverDataEngine(){
  const _hp=window.location.hash.replace("#","");
  const validPages=["dashboard","list","missions","collectors","routes","privacy","reports","create","packages","files","passport"];
  const [page,setPage]=useState(validPages.includes(_hp)?_hp:"dashboard");
  const [viewAssetId,setViewAssetId]=useState(null);

  // localStorage persistence
  const [assets,setAssets]=useState(()=>loadData("assets",MOCK_ASSETS));
  const [files,setFiles]=useState(()=>loadData("files",MOCK_FILES));
  const [missions,setMissions]=useState(()=>loadData("missions",MOCK_MISSIONS));
  const [collectors,setCollectors]=useState(()=>loadData("collectors",MOCK_COLLECTORS));
  const [routes,setRoutes]=useState(()=>loadData("routes",MOCK_ROUTES));
  const [reports,setReports]=useState(()=>loadData("reports",MOCK_REPORTS));
  const [products,setProducts]=useState(()=>loadData("products",MOCK_PRODUCTS));

  // Save to localStorage on any change
  useEffect(()=>{saveAllData({assets,files,missions,collectors,routes,reports,products});},[assets,files,missions,collectors,routes,reports,products]);
  useEffect(()=>{var ls=document.getElementById('loading-screen');if(ls)ls.style.display='none';},[]);

  // Hash routing
  useEffect(()=>{
    const handleHash=()=>{const h=window.location.hash.replace("#","");if(validPages.includes(h))setPage(h);};
    window.addEventListener('hashchange',handleHash);
    return()=>window.removeEventListener('hashchange',handleHash);
  },[]);
  useEffect(()=>{if(page!=="passport")window.location.hash=page;},[page]);

  const handleView=(id)=>{setViewAssetId(id);setPage("passport");};
  const handleBack=()=>{setViewAssetId(null);setPage("list");};
  const handleCreate=(formData)=>{
    const newAsset={...formData,asset_id:`BDP-2026-${String(assets.length+1).padStart(6,"0")}`,created_at:new Date().toISOString(),updated_at:new Date().toISOString(),mission_id:`MSN-${Date.now()}`,start_time:formData.start_time||null,end_time:formData.end_time||null,duration_seconds:formData.duration_seconds?parseInt(formData.duration_seconds):0,distance_meters:formData.distance_meters?parseInt(formData.distance_meters):0,average_speed_mps:formData.average_speed_mps?parseFloat(formData.average_speed_mps):0,max_speed_mps:formData.max_speed_mps?parseFloat(formData.max_speed_mps):0,payload_kg:formData.payload_kg?parseFloat(formData.payload_kg):0,battery_start_percent:formData.battery_start_percent?parseInt(formData.battery_start_percent):0,battery_end_percent:formData.battery_end_percent?parseInt(formData.battery_end_percent):0,data_size_gb:formData.data_size_gb?parseFloat(formData.data_size_gb):0,video_duration_seconds:formData.video_duration_seconds?parseInt(formData.video_duration_seconds):0,frame_rate:formData.frame_rate?parseInt(formData.frame_rate):30,takeover_count:formData.takeover_count?parseInt(formData.takeover_count):0,takeover_duration_seconds:formData.takeover_duration_seconds?parseInt(formData.takeover_duration_seconds):0,gps_start_lat:0,gps_start_lng:0,gps_end_lat:0,gps_end_lng:0,sensor_config:{rgb_camera:formData.sensor_rgb,depth_camera:formData.sensor_depth,lidar:formData.sensor_lidar,imu:formData.sensor_imu,gps:formData.sensor_gps,wheel_odometry:formData.sensor_odom,microphone:formData.sensor_mic},sample_preview_url:"",camera_model:formData.camera_model||"",camera_mount_position:formData.camera_mount_position||"head_front",collector_id:formData.collector_id||"",collector_role:formData.collector_role||"courier",privacy_risk_level:"low",business_notes:{why_this_asset_matters:formData.business_why||"",customer_relevance:formData.business_customer||"",robot_capability_gap:formData.business_gap||"",product_implication:formData.business_product||"",sales_angle:formData.business_sales||"",internal_priority:formData.business_priority||"medium",next_action:formData.business_next||""}};
    setAssets(prev=>[newAsset,...prev]);
  };

  const resetDemoData=()=>{
    if(confirm("确认重置所有数据为演示数据？\nReset all data to demo defaults?")){
      setAssets(MOCK_ASSETS);setFiles(MOCK_FILES);setMissions(MOCK_MISSIONS);setCollectors(MOCK_COLLECTORS);setRoutes(MOCK_ROUTES);setReports(MOCK_REPORTS);setProducts(MOCK_PRODUCTS);
    }
  };

  const currentAsset=viewAssetId?assets.find(a=>a.asset_id===viewAssetId):null;
  const renderPage=()=>{
    if(page==="passport"&&currentAsset)return <AssetPassportPage asset={currentAsset} onBack={handleBack}/>;
    switch(page){
      case "dashboard":return <DashboardPage assets={assets} missions={missions} collectors={collectors} routes={routes}/>;
      case "list":return <AssetListPage assets={assets} onViewAsset={handleView}/>;
      case "missions":return <MissionsPage missions={missions} setMissions={setMissions} assets={assets}/>;
      case "collectors":return <CollectorsPage collectors={collectors} setCollectors={setCollectors}/>;
      case "routes":return <RoutesPage routes={routes} setRoutes={setRoutes} assets={assets}/>;
      case "privacy":return <PrivacyPage assets={assets} setAssets={setAssets}/>;
      case "reports":return <ReportsPage reports={reports} assets={assets} routes={routes} missions={missions}/>;
      case "create":return <CreateAssetPage onSubmit={handleCreate}/>;
      case "packages":return <ProductPackagesPage assets={assets} products={products} onViewAsset={handleView}/>;
      case "files":return <FileUploadPage assets={assets} files={files} setFiles={setFiles}/>;
      default:return <DashboardPage assets={assets} missions={missions} collectors={collectors} routes={routes}/>;
    }
  };
  return <div style={{display:"flex",minHeight:"100vh",backgroundColor:COLORS.bg,fontFamily:"-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"}}>
    <Sidebar activePage={page==="passport"?"list":page} onNavigate={p=>{setPage(p);if(p!=="passport")setViewAssetId(null);}}/>
    <div style={{flex:1,padding:28,overflowY:"auto",maxHeight:"100vh"}}>
      <div style={{display:"flex",justifyContent:"flex-end",marginBottom:8}}>
        <Btn variant="ghost" onClick={resetDemoData} style={{fontSize:12}}><Icon name="refresh" size={14}/> Reset Demo Data</Btn>
      </div>
      {renderPage()}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<BeaverDataEngine/>);
</script>
</body>
</html>
